const LEGAL={"es": {"ui": {"title": "Información legal", "updated": "Última actualización: 13 de noviembre de 2026", "terminos": "Términos y condiciones", "privacidad": "Privacidad de datos", "ia": "Uso de IA y regulación", "contact": "Contacto", "back": "Volver al inicio", "note": "Este texto es una versión inicial. Si tienes dudas sobre tus derechos, escríbenos."}, "terminos": [["1. Quiénes somos", ["alaprima es un servicio de Limly LLC, sociedad de responsabilidad limitada constituida en Delaware, EE.UU., con domicilio en 8 The Green, Suite B, Dover, DE 19901 (“alaprima”, “nosotros”). Al crear una cuenta o comprar un servicio aceptas estos términos."]], ["2. Qué hacemos", ["alaprima ofrece una herramienta web de pre-revisión documental: un checklist de autorrevisión gratuito y, en los planes pagados, la lectura de tus documentos con inteligencia artificial y la validación de un revisor humano, con un informe de faltantes y observaciones probables.", "alaprima no es un despacho de abogados ni un colegio profesional, no presta asesoría legal, no reemplaza la firma de un profesional habilitado y no garantiza la aprobación de ningún trámite. La decisión corresponde siempre a la autoridad competente."]], ["3. Cuenta", ["Debes ser mayor de 18 años y dar datos verdaderos. Eres responsable de tu contraseña y de la actividad de tu cuenta. Puedes cerrar tu cuenta cuando quieras escribiéndonos."]], ["4. Precios y pagos", ["Los precios se muestran en dólares estadounidenses y pueden variar por región. Los pagos los procesa Polar como vendedor oficial (Merchant of Record), que emite el comprobante y calcula los impuestos aplicables en tu país. No almacenamos datos de tu tarjeta.", "Los Packs de 5 revisiones son válidos por 6 meses desde la compra."]], ["5. Entrega", ["Una vez que compartes el link a tus documentos, entregamos el informe por correo en un plazo objetivo de 24 horas hábiles (12 horas en los Packs con prioridad). El Pre-check Obra incluye una re-revisión del mismo expediente."]], ["6. Reembolsos", ["Te devolvemos el 100% si: (a) no entregamos el informe dentro de 48 horas desde que compartiste tus documentos completos, o (b) no podemos revisar tu trámite o ciudad. Puedes pedir el reembolso de un pre-check que todavía no empezamos (sin documentos compartidos) dentro de los 14 días posteriores a la compra. Al compartir tus documentos nos pides empezar el servicio; una vez entregado el informe no hay reembolso, salvo lo que exija la ley de protección al consumidor de tu país."]], ["7. Tus documentos y tu contenido", ["Los documentos siguen siendo tuyos. Nos das permiso para usarlos solo para prestar el servicio. Debes tener derecho a compartirlos. No subas información de terceros que no estés autorizado a compartir."]], ["8. Uso aceptable", ["No uses alaprima para fines ilegales, para engañar a una autoridad, para presentar documentos falsos ni para intentar vulnerar la seguridad del servicio."]], ["9. Limitación de responsabilidad", ["El servicio se ofrece “tal cual”. Las normas cambian y cada autoridad interpreta sus requisitos; el informe es orientativo. En la medida que la ley lo permita, nuestra responsabilidad total frente a ti se limita al monto que pagaste por el servicio que originó el reclamo. No respondemos por demoras, observaciones o rechazos de la autoridad."]], ["10. Cambios y ley aplicable", ["Podemos actualizar estos términos; te avisaremos de cambios importantes. Se rigen por las leyes del estado de Delaware, EE.UU., sin perjuicio de los derechos que te otorgue la ley de protección al consumidor de tu país de residencia."]]], "privacidad": [["1. Responsable", ["El responsable del tratamiento es Limly LLC, 8 The Green, Suite B, Dover, DE 19901, EE.UU. Para cualquier consulta sobre tus datos escríbenos al correo de contacto indicado al final."]], ["2. Qué datos recogemos", ["Cuenta: nombre, correo, país, idioma y, si entras con Google, tu nombre y correo de Google. Las contraseñas las gestiona Google Firebase de forma cifrada; nosotros no las vemos.", "Formularios: nombre, correo, país, ciudad, perfil, trámite y las preguntas que nos envías.", "Informes: las respuestas del checklist, la ciudad, el trámite y los nombres de archivo. En la autorrevisión gratuita, los archivos no se suben a nuestros servidores: se quedan en tu navegador.", "Pedidos: producto, precio, estado, número de pago de Polar y el link a los documentos que compartes. Los datos de tarjeta los trata Polar, nunca nosotros.", "Técnicos: tu navegador guarda el idioma elegido y la sesión. No usamos cookies de publicidad ni rastreadores de terceros."]], ["3. Para qué los usamos", ["Prestar el servicio y entregar informes (ejecución del contrato); responder tus preguntas y enviarte el checklist que pediste (tu consentimiento); facturación e impuestos (obligación legal); seguridad y mejora del servicio (interés legítimo). No vendemos tus datos."]], ["4. Con quién los compartimos", ["Proveedores que tratan datos por cuenta nuestra: Google Firebase (cuentas y base de datos), Polar (pagos e impuestos), Anthropic (análisis con IA de documentos en las revisiones pagadas), el proveedor de hosting de la web (Cloudflare o Vercel) y Google (correo). Solo comparten lo necesario para su función."]], ["5. Transferencias internacionales", ["Nuestros proveedores pueden tratar datos en EE.UU. u otros países. Cuando corresponde, usamos cláusulas contractuales tipo u otras garantías equivalentes."]], ["6. Cuánto tiempo los guardamos", ["Cuenta e informes: mientras tu cuenta esté activa. Links a documentos: retiramos el acceso y borramos copias a los 90 días de entregado el informe, o antes si lo pides. Contactos y preguntas: hasta 24 meses o hasta que pidas la baja. Datos de facturación: el plazo que exija la ley tributaria."]], ["7. Tus derechos", ["Puedes pedir acceso, rectificación, eliminación, portabilidad, oposición o limitación del tratamiento, y retirar tu consentimiento cuando quieras. Esto incluye los derechos del RGPD (UE), LGPD (Brasil), Ley 29733 de Perú (derechos ARCO), leyes de privacidad de EE.UU. como la CCPA de California, la Ley 25 de Quebec y normas equivalentes de México, Colombia, Chile y otros países. Respondemos en un máximo de 30 días. También puedes reclamar ante la autoridad de protección de datos de tu país."]], ["8. Seguridad", ["Usamos conexiones cifradas (HTTPS), reglas de acceso por usuario en la base de datos y proveedores con estándares de seguridad reconocidos. Ningún sistema es 100% seguro; si ocurre un incidente que te afecte, te avisaremos."]], ["9. Menores", ["El servicio es para mayores de 18 años. No recogemos a sabiendas datos de menores."]]], "ia": [["1. Cómo usamos la IA", ["alaprima usa inteligencia artificial para leer documentos de expedientes (PDF e imágenes), compararlos con listas de requisitos de cada ciudad y sugerir faltantes u observaciones probables. El checklist gratuito funciona con reglas fijas, sin IA."]], ["2. Siempre hay una persona", ["En los servicios pagados, un revisor humano valida cada informe antes de enviarlo. Los hallazgos generados por IA se marcan como “IA”. Puedes pedir que una persona revise cualquier resultado."]], ["3. Lo que la IA no hace", ["No aprueba ni rechaza trámites, no toma decisiones con efectos legales sobre personas, no evalúa tu solvencia ni tu perfil, y no reemplaza a un profesional habilitado. La decisión final es siempre de la autoridad competente."]], ["4. Limitaciones", ["La IA puede equivocarse u omitir requisitos; las normas cambian y cada autoridad las interpreta. Por eso el informe es orientativo y lo valida una persona."]], ["5. Tus datos y el proveedor de IA", ["Para el análisis usamos la API de Anthropic (modelos Claude). Solo enviamos los documentos que compartes para tu revisión. Según los términos comerciales vigentes del proveedor, los datos enviados por API no se usan para entrenar sus modelos. Nosotros tampoco usamos tus documentos para entrenar modelos sin tu permiso expreso."]], ["6. Marco regulatorio que seguimos", ["Unión Europea: cumplimos las obligaciones de transparencia del Reglamento de IA (UE) 2024/1689: informamos que se usa IA y marcamos el contenido generado. Según nuestra evaluación, alaprima no es un sistema de alto riesgo, porque no decide sobre el acceso de personas a servicios públicos ni sobre derechos; si eso cambia, actualizaremos este aviso.", "Brasil: respetamos el derecho a solicitar la revisión de decisiones automatizadas del artículo 20 de la LGPD y seguimos la discusión del proyecto de ley de IA.", "Perú: seguimos los principios de la Ley N.º 31814, que promueve el uso de la IA, y su reglamento: transparencia, supervisión humana, privacidad y no discriminación.", "Canadá (Quebec): informamos el uso de tratamiento automatizado conforme a la Ley 25.", "Estados Unidos: no usamos IA para tomar decisiones consecuentes sobre personas (empleo, crédito, vivienda, salud o servicios esenciales) en el sentido de las leyes estatales de IA, e informamos siempre cuando interactúas con IA.", "Seguimos además los principios de la OCDE y de la UNESCO sobre IA confiable."]], ["7. Contacto", ["Si tienes preguntas sobre el uso de IA, quieres una revisión humana o deseas presentar un reclamo, escríbenos al correo de contacto. Respondemos en un máximo de 30 días."]]]}, "en": {"ui": {"title": "Legal", "updated": "Last updated: November 13, 2026", "terminos": "Terms & Conditions", "privacidad": "Data Privacy", "ia": "AI Use & Regulation", "contact": "Contact", "back": "Back to home", "note": "This is an initial version. If you have questions about your rights, write to us."}, "terminos": [["1. Who we are", ["alaprima is a service of Limly LLC, a Delaware limited liability company located at 8 The Green, Suite B, Dover, DE 19901, USA (“alaprima”, “we”). By creating an account or buying a service you accept these terms."]], ["2. What we do", ["alaprima provides a web-based document pre-check tool: a free self-check checklist and, on paid plans, AI reading of your documents validated by a human reviewer, with a report of missing items and likely corrections.", "alaprima is not a law firm or licensing body, does not give legal advice, does not replace a licensed professional’s stamp and does not guarantee approval of any application. The decision always belongs to the competent authority."]], ["3. Account", ["You must be 18 or older and provide accurate information. You are responsible for your password and your account activity. You can close your account at any time by writing to us."]], ["4. Prices and payment", ["Prices are shown in US dollars and may vary by region. Payments are processed by Polar as Merchant of Record, which issues the receipt and calculates applicable taxes in your country. We do not store your card details.", "Packs of 5 reviews are valid for 6 months from purchase."]], ["5. Delivery", ["Once you share the link to your documents, we deliver the report by email with a target of 24 business hours (12 hours for priority Packs). The Build pre-check includes one re-check of the same application."]], ["6. Refunds", ["We refund 100% if: (a) we don’t deliver the report within 48 hours after you share complete documents, or (b) we can’t review your permit type or city. You can request a refund for a pre-check we haven’t started (no documents shared) within 14 days of purchase. By sharing your documents you ask us to start the service; once the report is delivered there is no refund, except where your local consumer law requires it."]], ["7. Your documents and content", ["Your documents remain yours. You allow us to use them only to provide the service. You must have the right to share them."]], ["8. Acceptable use", ["Do not use alaprima for illegal purposes, to mislead an authority, to submit false documents or to attempt to breach the security of the service."]], ["9. Limitation of liability", ["The service is provided “as is”. Rules change and each authority interprets its requirements; the report is informational. To the extent permitted by law, our total liability to you is limited to the amount you paid for the service giving rise to the claim. We are not liable for delays, corrections or denials issued by the authority."]], ["10. Changes and governing law", ["We may update these terms and will notify you of material changes. They are governed by the laws of the State of Delaware, USA, without prejudice to the rights granted by the consumer protection law of your country of residence."]]], "privacidad": [["1. Controller", ["The data controller is Limly LLC, 8 The Green, Suite B, Dover, DE 19901, USA. For any question about your data, write to the contact email below."]], ["2. Data we collect", ["Account: name, email, country, language and, if you sign in with Google, your Google name and email. Passwords are handled in encrypted form by Google Firebase; we never see them.", "Forms: name, email, country, city, profile, permit type and the questions you send us.", "Reports: checklist answers, city, permit type and file names. In the free self-check, files are not uploaded to our servers; they stay in your browser.", "Orders: product, price, status, Polar payment ID and the link to the documents you share. Card data is handled by Polar, never by us.", "Technical: your browser stores your chosen language and session. We use no advertising cookies or third-party trackers."]], ["3. Why we use it", ["To provide the service and deliver reports (contract); to answer your questions and send the checklist you requested (consent); billing and taxes (legal obligation); security and service improvement (legitimate interest). We do not sell your data."]], ["4. Who we share it with", ["Processors acting on our behalf: Google Firebase (accounts and database), Polar (payments and taxes), Anthropic (AI analysis of documents in paid reviews), our website hosting provider (Cloudflare or Vercel) and Google (email). Each receives only what it needs."]], ["5. International transfers", ["Our providers may process data in the US or other countries. Where required, we rely on standard contractual clauses or equivalent safeguards."]], ["6. How long we keep it", ["Account and reports: while your account is active. Document links: we remove access and delete copies 90 days after delivering the report, or sooner on request. Contacts and questions: up to 24 months or until you opt out. Billing data: as long as tax law requires."]], ["7. Your rights", ["You can request access, correction, deletion, portability, objection or restriction, and withdraw consent at any time. This includes rights under the GDPR (EU), LGPD (Brazil), Peru’s Law 29733, US state privacy laws such as California’s CCPA, Quebec’s Law 25 and equivalent laws in Mexico, Colombia, Chile and elsewhere. We reply within 30 days. You may also complain to your local data protection authority."]], ["8. Security", ["We use encrypted connections (HTTPS), per-user access rules in our database and providers with recognized security standards. No system is 100% secure; if an incident affects you, we will let you know."]], ["9. Minors", ["The service is for people 18 and older. We do not knowingly collect data from minors."]]], "ia": [["1. How we use AI", ["alaprima uses artificial intelligence to read application documents (PDFs and images), compare them with each city’s requirement lists and suggest missing items or likely corrections. The free checklist runs on fixed rules, without AI."]], ["2. A human is always involved", ["In paid services, a human reviewer validates every report before it is sent. AI-generated findings are labeled “AI”. You can ask a person to review any result."]], ["3. What AI does not do", ["It does not approve or deny permits, make decisions with legal effects on people, assess your creditworthiness or profile, or replace a licensed professional. The final decision always rests with the competent authority."]], ["4. Limitations", ["AI can make mistakes or miss requirements; rules change and each authority interprets them. That’s why the report is informational and validated by a person."]], ["5. Your data and the AI provider", ["For analysis we use Anthropic’s API (Claude models). We only send the documents you share for your review. Under the provider’s current commercial terms, data sent via the API is not used to train its models. We do not use your documents to train models without your explicit permission."]], ["6. Regulatory framework we follow", ["European Union: we meet the transparency obligations of the AI Act (Regulation (EU) 2024/1689): we disclose AI use and label generated content. In our assessment, alaprima is not a high-risk system, as it does not decide on people’s access to public services or rights; if that changes, we will update this notice.", "Brazil: we honor the right to request review of automated decisions under Article 20 of the LGPD and follow the AI bill under discussion.", "Peru: we follow the principles of Law No. 31814 promoting AI and its regulation: transparency, human oversight, privacy and non-discrimination.", "Canada (Quebec): we disclose automated processing as required by Law 25.", "United States: we do not use AI to make consequential decisions about people (employment, credit, housing, healthcare or essential services) within the meaning of state AI laws, and we always disclose when you interact with AI.", "We also follow the OECD and UNESCO principles for trustworthy AI."]], ["7. Contact", ["If you have questions about our use of AI, want a human review or wish to file a complaint, write to our contact email. We reply within 30 days."]]]}, "pt": {"ui": {"title": "Informações legais", "updated": "Última atualização: 13 de novembro de 2026", "terminos": "Termos e condições", "privacidad": "Privacidade de dados", "ia": "Uso de IA e regulação", "contact": "Contato", "back": "Voltar ao início", "note": "Esta é uma versão inicial. Se tiver dúvidas sobre seus direitos, escreva para nós."}, "terminos": [["1. Quem somos", ["A alaprima é um serviço da Limly LLC, sociedade de responsabilidade limitada constituída em Delaware, EUA, com sede em 8 The Green, Suite B, Dover, DE 19901 (“alaprima”, “nós”). Ao criar uma conta ou comprar um serviço, você aceita estes termos."]], ["2. O que fazemos", ["A alaprima oferece uma ferramenta web de pré-revisão documental: um checklist de autorrevisão gratuito e, nos planos pagos, a leitura dos seus documentos com inteligência artificial validada por um revisor humano, com relatório de pendências e exigências prováveis.", "A alaprima não é escritório de advocacia nem conselho profissional, não presta assessoria jurídica, não substitui a ART/RRT de um profissional habilitado e não garante a aprovação de nenhum processo. A decisão é sempre do órgão competente."]], ["3. Conta", ["Você deve ter 18 anos ou mais e fornecer dados verdadeiros. Você é responsável pela sua senha e pela atividade da sua conta. Pode encerrar a conta quando quiser escrevendo para nós."]], ["4. Preços e pagamentos", ["Os preços são exibidos em dólares americanos e podem variar por região. Os pagamentos são processados pela Polar como vendedora oficial (Merchant of Record), que emite o recibo e calcula os impostos aplicáveis no seu país. Não armazenamos dados do seu cartão.", "Os Pacotes de 5 revisões valem por 6 meses a partir da compra."]], ["5. Entrega", ["Depois que você compartilha o link dos seus documentos, entregamos o relatório por e-mail com prazo-alvo de 24 horas úteis (12 horas nos Pacotes com prioridade). O Pré-check Obra inclui uma nova revisão do mesmo processo."]], ["6. Reembolsos", ["Devolvemos 100% se: (a) não entregarmos o relatório em até 48 horas após você compartilhar os documentos completos, ou (b) não pudermos revisar seu processo ou cidade. Você pode pedir reembolso de um pré-check ainda não iniciado (sem documentos compartilhados) em até 14 dias após a compra. Ao compartilhar seus documentos, você pede que iniciemos o serviço; após a entrega do relatório não há reembolso, salvo o que exigir a lei de defesa do consumidor do seu país."]], ["7. Seus documentos e conteúdo", ["Os documentos continuam sendo seus. Você nos autoriza a usá-los apenas para prestar o serviço e deve ter o direito de compartilhá-los."]], ["8. Uso aceitável", ["Não use a alaprima para fins ilegais, para enganar uma autoridade, apresentar documentos falsos ou tentar violar a segurança do serviço."]], ["9. Limitação de responsabilidade", ["O serviço é oferecido “no estado em que se encontra”. As normas mudam e cada órgão interpreta seus requisitos; o relatório é orientativo. Na medida permitida pela lei, nossa responsabilidade total limita-se ao valor pago pelo serviço que originou a reclamação. Não respondemos por atrasos, exigências ou indeferimentos do órgão."]], ["10. Alterações e lei aplicável", ["Podemos atualizar estes termos e avisaremos sobre mudanças relevantes. Regem-se pelas leis do estado de Delaware, EUA, sem prejuízo dos direitos garantidos pela lei de defesa do consumidor do seu país de residência."]]], "privacidad": [["1. Controlador", ["O controlador dos dados é a Limly LLC, 8 The Green, Suite B, Dover, DE 19901, EUA. Para qualquer dúvida sobre seus dados, escreva para o e-mail de contato abaixo."]], ["2. Dados que coletamos", ["Conta: nome, e-mail, país, idioma e, se você entrar com Google, seu nome e e-mail do Google. As senhas são gerenciadas de forma criptografada pelo Google Firebase; nós não as vemos.", "Formulários: nome, e-mail, país, cidade, perfil, processo e as perguntas que você envia.", "Relatórios: respostas do checklist, cidade, processo e nomes de arquivos. Na autorrevisão gratuita, os arquivos não são enviados aos nossos servidores; ficam no seu navegador.", "Pedidos: produto, preço, status, ID de pagamento da Polar e o link dos documentos que você compartilha. Os dados do cartão são tratados pela Polar, nunca por nós.", "Técnicos: seu navegador guarda o idioma escolhido e a sessão. Não usamos cookies de publicidade nem rastreadores de terceiros."]], ["3. Para que usamos", ["Prestar o serviço e entregar relatórios (execução de contrato); responder perguntas e enviar o checklist solicitado (consentimento); faturamento e impostos (obrigação legal); segurança e melhoria do serviço (legítimo interesse). Não vendemos seus dados."]], ["4. Com quem compartilhamos", ["Operadores que tratam dados em nosso nome: Google Firebase (contas e banco de dados), Polar (pagamentos e impostos), Anthropic (análise de documentos com IA nas revisões pagas), o provedor de hospedagem do site (Cloudflare ou Vercel) e Google (e-mail). Cada um recebe só o necessário."]], ["5. Transferências internacionais", ["Nossos fornecedores podem tratar dados nos EUA ou em outros países. Quando aplicável, usamos cláusulas contratuais padrão ou garantias equivalentes, conforme a LGPD."]], ["6. Por quanto tempo", ["Conta e relatórios: enquanto a conta estiver ativa. Links de documentos: retiramos o acesso e apagamos cópias 90 dias após a entrega do relatório, ou antes se você pedir. Contatos e perguntas: até 24 meses ou até você pedir o descadastro. Dados de faturamento: pelo prazo exigido pela lei tributária."]], ["7. Seus direitos", ["Você pode solicitar confirmação, acesso, correção, anonimização, eliminação, portabilidade, informação sobre compartilhamento e revogação do consentimento (art. 18 da LGPD), além dos direitos equivalentes do RGPD (UE), da Lei 29733 do Peru, da CCPA da Califórnia e da Lei 25 de Quebec. Respondemos em até 30 dias. Você também pode reclamar à ANPD ou à autoridade do seu país."]], ["8. Segurança", ["Usamos conexões criptografadas (HTTPS), regras de acesso por usuário no banco de dados e fornecedores com padrões de segurança reconhecidos. Nenhum sistema é 100% seguro; se ocorrer um incidente que afete você, avisaremos."]], ["9. Menores", ["O serviço é para maiores de 18 anos. Não coletamos intencionalmente dados de menores."]]], "ia": [["1. Como usamos a IA", ["A alaprima usa inteligência artificial para ler documentos de processos (PDF e imagens), compará-los com as listas de requisitos de cada cidade e sugerir pendências ou exigências prováveis. O checklist gratuito funciona com regras fixas, sem IA."]], ["2. Sempre há uma pessoa", ["Nos serviços pagos, um revisor humano valida cada relatório antes do envio. Os achados gerados por IA são marcados como “IA”. Você pode pedir que uma pessoa revise qualquer resultado."]], ["3. O que a IA não faz", ["Não aprova nem indefere processos, não toma decisões com efeitos jurídicos sobre pessoas, não avalia seu perfil ou crédito e não substitui um profissional habilitado. A decisão final é sempre do órgão competente."]], ["4. Limitações", ["A IA pode errar ou omitir requisitos; as normas mudam e cada órgão as interpreta. Por isso o relatório é orientativo e validado por uma pessoa."]], ["5. Seus dados e o provedor de IA", ["Para a análise usamos a API da Anthropic (modelos Claude). Só enviamos os documentos que você compartilha para a sua revisão. Segundo os termos comerciais vigentes do provedor, os dados enviados via API não são usados para treinar seus modelos. Nós também não usamos seus documentos para treinar modelos sem sua autorização expressa."]], ["6. Marco regulatório que seguimos", ["União Europeia: cumprimos as obrigações de transparência do Regulamento de IA (UE) 2024/1689: informamos o uso de IA e identificamos o conteúdo gerado. Na nossa avaliação, a alaprima não é um sistema de alto risco, pois não decide sobre o acesso de pessoas a serviços públicos ou direitos; se isso mudar, atualizaremos este aviso.", "Brasil: garantimos o direito de solicitar revisão de decisões automatizadas (art. 20 da LGPD) e acompanhamos o projeto de lei de IA em discussão no Congresso.", "Peru: seguimos os princípios da Lei nº 31814, que promove o uso da IA, e seu regulamento: transparência, supervisão humana, privacidade e não discriminação.", "Canadá (Quebec): informamos o tratamento automatizado conforme a Lei 25.", "Estados Unidos: não usamos IA para tomar decisões relevantes sobre pessoas (emprego, crédito, moradia, saúde ou serviços essenciais) no sentido das leis estaduais de IA, e sempre informamos quando você interage com IA.", "Seguimos também os princípios da OCDE e da UNESCO para uma IA confiável."]], ["7. Contato", ["Se tiver dúvidas sobre o uso de IA, quiser uma revisão humana ou registrar uma reclamação, escreva para o nosso e-mail de contato. Respondemos em até 30 dias."]]]}, "fr": {"ui": {"title": "Informations légales", "updated": "Dernière mise à jour : 13 novembre 2026", "terminos": "Conditions générales", "privacidad": "Confidentialité des données", "ia": "Usage de l’IA et réglementation", "contact": "Contact", "back": "Retour à l’accueil", "note": "Ce texte est une version initiale. Pour toute question sur vos droits, écrivez-nous."}, "terminos": [["1. Qui sommes-nous", ["alaprima est un service de Limly LLC, société à responsabilité limitée constituée au Delaware (États-Unis), située 8 The Green, Suite B, Dover, DE 19901 (« alaprima », « nous »). En créant un compte ou en achetant un service, vous acceptez ces conditions."]], ["2. Notre service", ["alaprima propose un outil web de pré-vérification documentaire : une checklist d’autocontrôle gratuite et, dans les offres payantes, la lecture de vos pièces par intelligence artificielle validée par un relecteur humain, avec un rapport des pièces manquantes et des remarques probables.", "alaprima n’est ni un cabinet d’avocats ni un ordre professionnel, ne fournit pas de conseil juridique, ne remplace pas un architecte lorsque son recours est obligatoire et ne garantit l’obtention d’aucune autorisation. La décision appartient toujours à l’autorité compétente."]], ["3. Compte", ["Vous devez avoir 18 ans ou plus et fournir des informations exactes. Vous êtes responsable de votre mot de passe et de l’activité de votre compte. Vous pouvez fermer votre compte à tout moment en nous écrivant."]], ["4. Prix et paiement", ["Les prix sont affichés en dollars américains et peuvent varier selon la région. Les paiements sont traités par Polar en tant que vendeur officiel (Merchant of Record), qui émet le reçu et calcule la TVA applicable dans votre pays. Nous ne conservons pas vos données de carte.", "Les Packs de 5 vérifications sont valables 6 mois à compter de l’achat."]], ["5. Livraison", ["Dès que vous partagez le lien vers vos pièces, nous livrons le rapport par e-mail avec un objectif de 24 heures ouvrées (12 heures pour les Packs prioritaires). Le Pré-check Travaux inclut une nouvelle vérification du même dossier."]], ["6. Remboursements", ["Nous remboursons 100 % si : (a) nous ne livrons pas le rapport dans les 48 heures suivant le partage de pièces complètes, ou (b) nous ne pouvons pas traiter votre démarche ou votre commune. Vous pouvez demander le remboursement d’un pré-check non commencé (aucune pièce partagée) dans les 14 jours suivant l’achat. En partageant vos pièces, vous demandez l’exécution immédiate du service et reconnaissez que, une fois le rapport livré, le droit de rétractation ne s’applique plus, sauf disposition impérative de votre droit de la consommation."]], ["7. Vos pièces et contenus", ["Vos documents restent les vôtres. Vous nous autorisez à les utiliser uniquement pour fournir le service et devez avoir le droit de les partager."]], ["8. Usage acceptable", ["N’utilisez pas alaprima à des fins illégales, pour tromper une administration, déposer de faux documents ou porter atteinte à la sécurité du service."]], ["9. Limitation de responsabilité", ["Le service est fourni « en l’état ». Les règles évoluent et chaque administration interprète ses exigences ; le rapport est indicatif. Dans la mesure permise par la loi, notre responsabilité totale est limitée au montant payé pour le service à l’origine de la réclamation. Nous ne sommes pas responsables des délais, demandes de pièces ou refus de l’administration."]], ["10. Modifications et droit applicable", ["Nous pouvons mettre à jour ces conditions et vous informerons de tout changement important. Elles sont régies par le droit de l’État du Delaware (États-Unis), sans préjudice des droits que vous accorde le droit de la consommation de votre pays de résidence."]]], "privacidad": [["1. Responsable du traitement", ["Le responsable du traitement est Limly LLC, 8 The Green, Suite B, Dover, DE 19901, États-Unis. Pour toute question sur vos données, écrivez à l’adresse de contact ci-dessous."]], ["2. Données collectées", ["Compte : nom, e-mail, pays, langue et, si vous vous connectez avec Google, votre nom et votre e-mail Google. Les mots de passe sont gérés sous forme chiffrée par Google Firebase ; nous ne les voyons jamais.", "Formulaires : nom, e-mail, pays, ville, profil, démarche et questions envoyées.", "Rapports : réponses à la checklist, ville, démarche et noms de fichiers. Lors de l’autocontrôle gratuit, les fichiers ne sont pas envoyés sur nos serveurs ; ils restent dans votre navigateur.", "Commandes : produit, prix, statut, identifiant de paiement Polar et lien vers les pièces partagées. Les données de carte sont traitées par Polar, jamais par nous.", "Techniques : votre navigateur conserve la langue choisie et la session. Aucun cookie publicitaire ni traceur tiers."]], ["3. Finalités et bases légales", ["Fournir le service et livrer les rapports (exécution du contrat) ; répondre à vos questions et vous envoyer la checklist demandée (consentement) ; facturation et fiscalité (obligation légale) ; sécurité et amélioration du service (intérêt légitime). Nous ne vendons pas vos données."]], ["4. Destinataires", ["Sous-traitants agissant pour notre compte : Google Firebase (comptes et base de données), Polar (paiements et taxes), Anthropic (analyse IA des pièces dans les relectures payantes), l’hébergeur du site (Cloudflare ou Vercel) et Google (messagerie). Chacun ne reçoit que le nécessaire."]], ["5. Transferts hors UE", ["Nos prestataires peuvent traiter des données aux États-Unis ou ailleurs. Le cas échéant, nous nous appuyons sur les clauses contractuelles types de la Commission européenne ou des garanties équivalentes."]], ["6. Durées de conservation", ["Compte et rapports : tant que le compte est actif. Liens vers les pièces : accès retiré et copies supprimées 90 jours après la livraison du rapport, ou plus tôt sur demande. Contacts et questions : 24 mois maximum ou jusqu’à votre désinscription. Données de facturation : durée légale."]], ["7. Vos droits", ["Vous disposez des droits d’accès, de rectification, d’effacement, de portabilité, d’opposition et de limitation, et pouvez retirer votre consentement à tout moment (RGPD). Les résidents du Québec bénéficient des droits de la Loi 25. Nous répondons sous 30 jours. Vous pouvez aussi saisir la CNIL, l’APD belge, le PFPDT suisse ou la CAI du Québec."]], ["8. Sécurité", ["Connexions chiffrées (HTTPS), règles d’accès par utilisateur dans notre base de données et prestataires aux standards de sécurité reconnus. Aucun système n’est infaillible ; en cas d’incident vous concernant, nous vous informerons."]], ["9. Mineurs", ["Le service est réservé aux personnes de 18 ans et plus. Nous ne collectons pas sciemment de données de mineurs."]]], "ia": [["1. Notre usage de l’IA", ["alaprima utilise l’intelligence artificielle pour lire les pièces d’un dossier (PDF et images), les comparer aux listes d’exigences de chaque commune et suggérer les pièces manquantes ou remarques probables. La checklist gratuite fonctionne avec des règles fixes, sans IA."]], ["2. Toujours un humain", ["Dans les services payants, un relecteur humain valide chaque rapport avant envoi. Les constats générés par l’IA sont marqués « IA ». Vous pouvez demander qu’une personne revoie tout résultat."]], ["3. Ce que l’IA ne fait pas", ["Elle n’accorde ni ne refuse d’autorisation, ne prend aucune décision produisant des effets juridiques sur des personnes, n’évalue ni votre profil ni votre solvabilité et ne remplace pas un professionnel habilité. La décision finale appartient toujours à l’autorité compétente."]], ["4. Limites", ["L’IA peut se tromper ou omettre des exigences ; les règles évoluent et chaque administration les interprète. C’est pourquoi le rapport est indicatif et validé par une personne."]], ["5. Vos données et le fournisseur d’IA", ["Pour l’analyse, nous utilisons l’API d’Anthropic (modèles Claude). Nous n’envoyons que les pièces que vous partagez pour votre relecture. Selon les conditions commerciales en vigueur du fournisseur, les données envoyées via l’API ne servent pas à entraîner ses modèles. Nous n’utilisons pas non plus vos documents pour entraîner des modèles sans votre accord exprès."]], ["6. Cadre réglementaire suivi", ["Union européenne : nous respectons les obligations de transparence du règlement sur l’IA (UE) 2024/1689 : nous signalons l’usage de l’IA et identifions les contenus générés. Selon notre analyse, alaprima n’est pas un système à haut risque, car il ne décide pas de l’accès des personnes aux services publics ou à des droits ; si cela change, nous mettrons cet avis à jour.", "France et Belgique : traitement conforme au RGPD, y compris le droit de ne pas faire l’objet d’une décision fondée exclusivement sur un traitement automatisé (article 22).", "Canada (Québec) : nous informons du traitement automatisé conformément à la Loi 25.", "Brésil et Pérou : nous respectons l’article 20 de la LGPD et les principes de la loi péruvienne n° 31814 et de son règlement.", "États-Unis : nous n’utilisons pas l’IA pour prendre des décisions déterminantes sur des personnes au sens des lois des États sur l’IA, et nous indiquons toujours quand vous interagissez avec une IA.", "Nous suivons également les principes de l’OCDE et de l’UNESCO pour une IA digne de confiance."]], ["7. Contact", ["Pour toute question sur notre usage de l’IA, pour demander une relecture humaine ou déposer une réclamation, écrivez à notre adresse de contact. Nous répondons sous 30 jours."]]]}};
const CFG=window.ALAPRIMA_CONFIG;let LANG='es';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){const D=LEGAL[LANG],U=D.ui;let k=location.hash.slice(1);if(!['terminos','privacidad','ia'].includes(k))k='terminos';
 document.documentElement.lang=LANG;document.title='alaprima · '+U[k];
 document.getElementById('ttl').textContent=U.title;document.getElementById('upd').textContent=U.updated;
 document.getElementById('tabs').innerHTML=['terminos','privacidad','ia'].map(x=>`<a href="#${x}" ${x===k?'aria-current="page"':''}>${esc(U[x])}</a>`).join('');
 const mail=CFG.CONTACT_EMAIL?`<a href="mailto:${esc(CFG.CONTACT_EMAIL)}">${esc(CFG.CONTACT_EMAIL)}</a>`:'';
 document.getElementById('doc').innerHTML=`<h2>${esc(U[k])}</h2>`+D[k].map(([h,ps])=>`<h3>${esc(h)}</h3>`+ps.map(p=>`<p>${esc(p)}</p>`).join('')).join('')+`<div class="co"><b>${esc(U.contact)}</b><br>${esc(CFG.COMPANY)} · ${esc(CFG.COMPANY_ADDRESS)}${mail?'<br>'+mail:''}</div>`;
 document.getElementById('note').textContent=U.note;
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
 document.getElementById('home').href='index.html?lang='+LANG;AP_CORE.setLang(LANG);try{localStorage.setItem('ap_lang',LANG)}catch(e){}}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;history.replaceState(null,'','?lang='+LANG+location.hash);render()});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
(function(){const q=new URLSearchParams(location.search).get('lang');let s=null;try{s=localStorage.getItem('ap_lang')}catch(e){}const n=(navigator.language||'es').slice(0,2);LANG=[q,s,n].find(x=>x&&LEGAL[x])||'es';renderLogos();render();AP_CORE.mountAccount(document.getElementById('acct'))})();
</script>
