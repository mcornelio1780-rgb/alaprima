<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--cob:#2340D8;--deep:#142A8C;--gra:#14171F;--cal:#EEF0F3;--res:#F4E04D;--verde:#12A06B;--rojo:#D93A3A;--niebla:#C9D1E4;--t2:#4A5163;--amb:#9A7A00;
--f:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--f);background:var(--cal);color:var(--gra);font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--res);outline-offset:2px;border-radius:6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#fff;border-bottom:1px solid #DDE2EC}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:#fff}
.hd{display:flex;align-items:center;gap:18px;height:62px;width:min(1180px,100% - 32px);margin:auto}
.hd .lg{width:120px;display:block;flex:none}
.views{display:flex;gap:4px;margin-left:12px}
.views button{border:0;background:none;font:inherit;font-weight:600;font-size:15px;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--t2)}
.views button[aria-current=page]{background:var(--cal);color:var(--gra)}
.lang{margin-left:auto;display:flex;border:1px solid var(--niebla);border-radius:999px;padding:3px}
.lang button{border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:999px;cursor:pointer;color:var(--t2)}
.lang button[aria-pressed=true]{background:var(--gra);color:#fff}
@media(max-width:760px){.views{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #DDE2EC;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));margin:0;z-index:12}body{padding-bottom:70px}}
.wrap{width:min(1180px,100% - 32px);margin:28px auto 80px}
h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.04em;line-height:1.02;margin:0 0 8px;font-weight:900}
h2{font-size:24px;letter-spacing:-.02em;margin:0 0 12px}
.muted{color:var(--t2)}
.card{background:#fff;border:1px solid #DDE2EC;border-radius:20px;padding:24px}
.stepper{display:flex;gap:6px;margin:22px 0}
.stepper div{flex:1;height:6px;border-radius:4px;background:#DDE2EC}.stepper div.on{background:var(--cob)}
.stepl{font-size:14px;color:var(--t2);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;font-size:16px;padding:11px 13px;border-radius:12px;border:1.5px solid #CDD3E0;background:#fff;color:var(--gra);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--cob);outline:none;box-shadow:0 0 0 3px rgba(35,64,216,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;background:var(--cob);color:#fff;text-decoration:none;font-weight:700;font-size:15.5px;border:0;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.l{background:#fff;color:var(--gra);border:1.5px solid #CDD3E0}.btn.l:hover{border-color:var(--gra)}
.btn.y{background:var(--res);color:var(--gra)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.procs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.proc{text-align:left;font:inherit;background:#fff;border:1.5px solid #DDE2EC;border-radius:16px;padding:16px;cursor:pointer;color:inherit}
.proc:hover{border-color:var(--cob)}.proc[aria-pressed=true]{border-color:var(--cob);box-shadow:0 0 0 3px rgba(35,64,216,.15)}
.proc b{display:block;font-size:16.5px;letter-spacing:-.01em}.proc small{color:var(--t2)}
.drop{border:2px dashed var(--niebla);border-radius:18px;padding:30px;text-align:center;background:#F8F9FB;cursor:pointer}
.drop.over{border-color:var(--cob);background:#EEF1FD}
.req{display:grid;grid-template-columns:28px 1fr 220px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #EEF0F4}
@media(max-width:760px){.req{grid-template-columns:28px 1fr}.req select{grid-column:2}}
.req .g{font-size:13px;color:var(--t2)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--cal);color:var(--t2);margin-left:6px}
.pill.crit{background:#FBE9E9;color:#9B1C1C}
.q{padding:14px 0;border-bottom:1px solid #EEF0F4}
.seg{display:inline-flex;border:1.5px solid #CDD3E0;border-radius:10px;overflow:hidden;margin-top:8px}
.seg button{border:0;background:#fff;font:inherit;font-size:14px;font-weight:600;padding:7px 14px;cursor:pointer;color:var(--t2)}
.seg button+button{border-left:1.5px solid #CDD3E0}
.seg button[aria-pressed=true][data-v=yes]{background:#E5F5EE;color:#0B6B47}
.seg button[aria-pressed=true][data-v=no]{background:#FBE9E9;color:#9B1C1C}
.seg button[aria-pressed=true][data-v=unk]{background:#FFF7D1;color:#6B5600}
.nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
/* report */
.rep{display:grid;grid-template-columns:320px 1fr;gap:20px}@media(max-width:900px){.rep{grid-template-columns:1fr}}
.score{font-size:76px;font-weight:900;letter-spacing:-.06em;line-height:1}
.meter{height:12px;background:#E4E8F0;border-radius:6px;overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;background:var(--verde);transition:width .8s}
.fi{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:13px 0;border-top:1px solid #EEF0F4}
.st{font-size:13px;font-weight:800}.st.m{color:var(--rojo)}.st.p{color:var(--amb)}.st.ok{color:var(--verde)}.st.v{color:var(--cob)}
.fix{font-size:14.5px;color:var(--t2);margin-top:3px}
.morphwrap{width:84px}.morph{transform-box:fill-box;transform-origin:50% 50%;animation:morph 2.2s cubic-bezier(.75,0,.2,1) .2s both}
@keyframes morph{0%,15%{transform:scaleX(-1) rotate(138.9deg)}100%{transform:none}}
.notice{background:#FFF7D1;border-radius:12px;padding:12px 14px;font-size:14.5px;color:#5A4800}
.err{background:#FBE9E9;border-radius:12px;padding:12px 14px;font-size:14.5px;color:#9B1C1C}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #EEF0F4;vertical-align:top}th{background:#F6F7FA;position:sticky;top:0}
.tw{overflow:auto;max-height:520px;border:1px solid #DDE2EC;border-radius:14px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border:1px solid #DDE2EC;border-radius:16px;padding:16px}.kpi b{display:block;font-size:32px;letter-spacing:-.04em;font-weight:900}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gra);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}.toast.on{opacity:1}
@media print{header,.noprint,.views,.toast{display:none!important}body{background:#fff}.wrap{margin:0;width:100%}.card{border:0;padding:0}.rep{grid-template-columns:1fr}}

.lang{margin-left:auto}
#acct{display:flex;align-items:center}
.buy{background:#EEF1FD;border-radius:14px;padding:14px 16px;margin:12px 0}
.buy p{margin:4px 0 10px;font-size:14.5px;color:var(--t2)}
.buyrow{display:flex;flex-direction:column;gap:8px}
.gate{position:relative;margin-top:4px}
.gate-blur{filter:blur(5px);pointer-events:none;user-select:none;opacity:.7}
.gate-box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(rgba(255,255,255,.4),#fff 55%);padding:20px;gap:6px}
.gate-box p{margin:0 0 8px;color:var(--t2);max-width:40ch}
.olist{display:grid;gap:12px;margin-top:16px}
.ocard{background:#fff;border:1px solid #DDE2EC;border-radius:18px;padding:18px 20px}
.hl-card{border:2px solid var(--verde);box-shadow:0 0 0 4px rgba(18,160,107,.12)}
.docs{border-top:1px solid #EEF0F4;padding-top:12px;margin-top:4px}
.badge{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--cal);color:var(--t2);white-space:nowrap}
.b-paid_unverified,.b-docs_sent{background:#E5F5EE;color:#0B6B47}.b-in_review{background:#EEF1FD;color:var(--deep)}.b-delivered{background:var(--verde);color:#fff}.b-checkout{background:#FFF7D1;color:#6B5600}.b-refunded,.b-cancelled{background:#FBE9E9;color:#9B1C1C}
.ok-banner{background:#E5F5EE;color:#0B4F35;border-radius:14px;padding:14px 16px;font-weight:600;margin-top:14px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1.5px solid var(--niebla);background:#fff;font:inherit;font-size:14.5px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.subtabs button[aria-selected=true]{background:var(--gra);color:#fff;border-color:var(--gra)}
.needlogin h2{margin-top:0}
@media(max-width:760px){.apc-local{bottom:calc(80px + env(safe-area-inset-bottom,0px))!important}}
.foot{margin-top:60px;font-size:13px;color:var(--t2);line-height:1.8}
.foot a{color:var(--t2)}
@media(max-width:760px){.hd{gap:10px}.hd .lg{width:100px}}
@media print{header,.noprint,.views,.toast,.apc-local,#acct{display:none!important}body{background:#fff}.wrap{margin:0;width:100%}.card{border:0;padding:0}.rep{grid-template-columns:1fr}}
</style>
</head>

const MAIL={
es:{s:'{city}: expedientes sin observaciones',b:'Hola{nm},\n\nVi {biz} y quería escribirte directamente. Trabajamos con estudios y contratistas que presentan licencias en {city} y siempre escuchamos lo mismo: el expediente vuelve por un detalle (un plano sin escala, un certificado vencido, áreas que no cuadran) y se pierden semanas.\n\nCreamos alaprima: revisamos tu expediente contra los requisitos de tu municipalidad antes de presentarlo y te damos en 24 h la lista de faltantes y observaciones probables.\n\nEsta semana hacemos la primera revisión sin costo para 10 estudios. ¿Te interesa que revisemos tu próximo expediente?\n\n{sig}\n\nSi prefieres no recibir más correos, responde "baja" y no te volveré a escribir.'},
en:{s:'Fewer permit corrections in {city}',b:'Hi{nm},\n\nI came across {biz} and wanted to reach out directly. We work with architects and contractors who file permits in {city}, and we keep hearing the same thing: applications come back over small things (a missing dimension, an expired form, square footage that doesn’t match) and weeks get lost.\n\nWe built alaprima: we check your application against your city’s submittal requirements before you file and send you a list of missing items and likely corrections within 24 hours.\n\nThis week we’re doing the first pre-check free for 10 firms. Want us to look at your next submittal?\n\n{sig}\n\nIf you’d rather not hear from me again, just reply "unsubscribe".'},
pt:{s:'{city}: processos sem exigências',b:'Olá{nm},\n\nConheci {biz} e quis escrever diretamente. Trabalhamos com escritórios e construtoras que protocolam alvarás em {city} e sempre ouvimos o mesmo: o processo volta por um detalhe (planta sem cota, matrícula vencida, área que não bate) e se perdem semanas.\n\nCriamos a alaprima: revisamos o seu processo contra os requisitos da prefeitura antes do protocolo e enviamos em 24 h a lista de pendências e exigências prováveis.\n\nEsta semana fazemos a primeira revisão sem custo para 10 escritórios. Quer que a gente revise o seu próximo processo?\n\n{sig}\n\nSe preferir não receber mais e-mails, responda "sair" e não escrevo mais.'},
fr:{s:'{city} : des dossiers complets du premier coup',b:'Bonjour{nm},\n\nJ’ai découvert {biz} et je me permets de vous écrire directement. Nous travaillons avec des architectes et maîtres d’œuvre qui déposent des autorisations à {city}, et nous entendons toujours la même chose : le dossier revient pour un détail (une cote manquante, une pièce oubliée, une surface incohérente) et l’on perd des semaines.\n\nNous avons créé alaprima : nous vérifions votre dossier selon les exigences de votre commune avant le dépôt et vous envoyons sous 24 h la liste des pièces manquantes et des remarques probables.\n\nCette semaine, la première pré-vérification est offerte à 10 agences. Souhaitez-vous que nous regardions votre prochain dossier ?\n\n{sig}\n\nSi vous préférez ne plus recevoir de message, répondez « désinscription » et je ne vous écrirai plus.'}};
const CLANG={US:'en',CA:'en',GB:'en',AU:'en',FR:'fr',BE:'fr',CH:'fr',LU:'fr',MC:'fr',BR:'pt',PT:'pt',AO:'pt',MZ:'pt'};

/* ================= ESTADO ================= */
const RET=new URLSearchParams(location.search);
const CORE=window.AP_CORE, CFG=CORE.cfg, DB=CORE.db;
const S={lang:'es',proc:null,files:[],assign:{},ans:{},step:1,current:null,leadPage:0,view:'check',adm:'orders',paidOrder:null};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const t=(k,v)=>{let s=(I18N[S.lang][k]??I18N.es[k]??k);if(v)for(const x in v)s=String(s).replaceAll('{'+x+'}',v[x]);return s};
const store={get(k,d){try{return JSON.parse(localStorage.getItem('ap_'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('ap_'+k,JSON.stringify(v))}catch(e){toast('Storage full')}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[_\-.]+/g,' ');
const toast=(m,ms)=>CORE.toast(m,ms);
const PROC_CC={'PE-LF':'PE','PE-LE':'PE','US-ADU':'US','FR-PC':'FR','BR-SP':'BR','MX-CDMX':'MX'};
const fmtDate=s=>{try{return new Date(s).toLocaleDateString(S.lang,{day:'2-digit',month:'short',year:'numeric'})}catch(e){return s||''}};
const money=n=>S.lang==='fr'?n+' $':'$'+n;
const user=()=>CORE.user();

/* ================= NAVEGACIÓN ================= */
function applyI18n(){document.documentElement.lang=S.lang;$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===S.lang));
 $$('.lg-link').forEach(a=>a.href='legal.html?lang='+S.lang+'#'+a.dataset.h);
 CORE.setLang(S.lang);renderProcs();if(S.proc){renderReqs();renderQs()}$('#stepLabel').textContent=t('step',{n:S.step});if(S.step===4&&S.current)renderReport(S.current);refreshView();try{localStorage.setItem('ap_lang',S.lang)}catch(e){}}
function view(v){if(v==='admin'&&!CORE.isAdmin())v='check';S.view=v;$$('section[id^=v-]').forEach(s=>s.classList.toggle('hide',s.id!=='v-'+v));$$('.views button').forEach(x=>x.dataset.view===v?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'));history.replaceState(null,'','?lang='+S.lang+'#'+v);refreshView();window.scrollTo(0,0)}
function refreshView(){if(S.view==='reports')renderHist();if(S.view==='orders')renderOrders();if(S.view==='admin')renderAdmin()}
function needLogin(sec){const box=$('#v-'+sec+' .needlogin');const u=user();if(!box)return !!u;box.classList.toggle('hide',!!u);if(!u){box.innerHTML=`<h2>${t('need_login_h')}</h2><p class="muted">${t('need_login_p')}</p><button class="btn">${t('login_btn')}</button>`;box.querySelector('button').onclick=()=>CORE.openAuth('login',()=>refreshView())}return !!u}
function go(n){S.step=n;[1,2,3,4].forEach(i=>$('#s'+i).classList.toggle('hide',i!==n));$$('#stepper div').forEach((d,i)=>d.classList.toggle('on',i<n));$('#stepLabel').textContent=t('step',{n});window.scrollTo({top:0,behavior:'smooth'})}

/* ================= ASISTENTE ================= */
function renderProcs(){$('#procs').innerHTML=PROCS.map(p=>`<button class="proc" data-p="${p.id}" aria-pressed="${S.proc&&S.proc.id===p.id}"><b>${p.flag} ${esc(p.t[S.lang])}</b><small>${esc(p.place)}</small></button>`).join('');
 $$('.proc').forEach(b=>b.onclick=()=>{S.proc=PROCS.find(p=>p.id===b.dataset.p);S.assign={};S.ans={};autoMatch();renderProcs();$('#to2').disabled=false})}
const gloss=r=>S.lang!==S.proc.loc&&r.en&&r.en!==r.o?`<div class="g">${esc(r.en)}</div>`:'';
function autoMatch(){if(!S.proc)return;S.proc.reqs.forEach(r=>{if(S.assign[r.id]&&S.assign[r.id].startsWith('f:'))return;const f=S.files.find(f=>r.k.some(k=>norm(f.name).includes(norm(k))));if(f)S.assign[r.id]='f:'+f.name})}
function renderReqs(){const opts=r=>{const cur=S.assign[r.id]||'';return `<select data-r="${r.id}" aria-label="${esc(r.o)}"><option value="" ${!cur?'selected':''}>${t('opt_assign')}</option>${S.files.map(f=>`<option value="f:${esc(f.name)}" ${cur==='f:'+f.name?'selected':''}>📄 ${esc(f.name)}</option>`).join('')}<option value="have" ${cur==='have'?'selected':''}>${t('opt_have')}</option><option value="missing" ${cur==='missing'?'selected':''}>${t('opt_missing')}</option>${r.opt?`<option value="na" ${cur==='na'?'selected':''}>${t('opt_na')}</option>`:''}</select>`};
 const icon=r=>{const a=S.assign[r.id]||'';const ok=a.startsWith('f:')||a==='have'||a==='na';return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${ok?'#12A06B':a==='missing'?'#D93A3A':'#C9D1E4'}" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/>${ok?'<path d="M8 12l3 3 5-6"/>':a==='missing'?'<path d="M12 7v6M12 16.5v.5"/>':''}</svg>`};
 $('#reqs').innerHTML=S.proc.reqs.map(r=>`<div class="req">${icon(r)}<div><b>${esc(r.o)}</b>${r.c?`<span class="pill crit">${t('critical')}</span>`:''}${r.opt?`<span class="pill">${t('optional')}</span>`:''}${gloss(r)}</div>${opts(r)}</div>`).join('');

function compute(){const p=S.proc;let tot=0,got=0;const F=[];
 p.reqs.forEach(r=>{const a=S.assign[r.id]||'';const w=r.c?3:2;if(a==='na')return;tot+=w;
  if(a.startsWith('f:')){got+=w;F.push({type:'ok',item:r.o,detail:t('st_file',{f:a.slice(2)})})}
  else if(a==='have'){got+=w*.9;F.push({type:'ok',item:r.o,detail:t('declared')})}
  else F.push({type:r.opt?'verify':'missing',item:r.o,detail:S.lang!==p.loc?r.en:'',crit:!!r.c})});
 p.qs.forEach(q=>{const a=S.ans[q.id];tot+=2;if(a==='yes'){got+=2}else if(a==='no'){F.push({type:'likely',item:q.obs,detail:q.o,fix:q.fix})}else{got+=.8;F.push({type:'verify',item:q.o,detail:q.obs,fix:q.fix})}});
 const order={missing:0,likely:1,verify:2,ok:3};F.sort((a,b)=>order[a.type]-order[b.type]||(b.crit?1:0)-(a.crit?1:0));
 const rid='AP-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*90000)+10000);
 return {rid,created:new Date().toISOString(),proc:p.id,city:$('#city').value.trim()||p.place,project:$('#project').value.trim(),score:Math.round(got/tot*100),findings:F,ai:null,files:S.files.map(f=>f.name),lang:S.lang,docId:null}}

function parseCSV(text){text=text.replace(/^﻿/,'');const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}else{if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}}if(cur||row.length){row.push(cur);rows.push(row)}
 const h=rows.shift().map(x=>x.trim().toLowerCase());return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}

function renderLeads(){const all=store.get('leads',[]);const fc=$('#fCountry').value,fs=$('#fStatus').value,q=norm($('#fSearch').value||'');
 const countries=[...new Set(all.map(l=>l.country_code||l.country).filter(Boolean))].sort();
 $('#fCountry').innerHTML=`<option value="">${t('all')} (${all.length})</option>`+countries.map(c=>`<option ${c===fc?'selected':''}>${esc(c)}</option>`).join('');
 const sts=['new','sent','reply','won','lost'];$('#fStatus').innerHTML=`<option value="">${t('all')}</option>`+sts.map(s=>`<option value="${s}" ${s===fs?'selected':''}>${t('st_'+s)}</option>`).join('');
 let L=all.filter(l=>(!fc||(l.country_code||l.country)===fc)&&(!fs||(l.status||'new')===fs)&&(!q||norm(Object.values(l).join(' ')).includes(q)));
 const per=100,pg=Math.min(S.leadPage,Math.max(0,Math.ceil(L.length/per)-1));const page=L.slice(pg*per,pg*per+per);
 $('#leadBody').innerHTML=page.map(l=>`<tr><td><b>${esc(l.name||'—')}</b><br><span class="muted" style="font-size:12.5px">${esc(l.category||'')} ${l.website?'· <a href="'+esc(l.website)+'" target="_blank" rel="noopener">web</a>':''}</span></td><td>${esc(l.email)}</td><td>${esc(l.city||'')}<br><span class="muted">${esc(l.country_code||l.country||'')}</span></td><td>${leadLang(l).toUpperCase()}</td><td><select data-st="${esc(l.email)}" style="width:auto;padding:6px 8px;font-size:13.5px">${sts.map(s=>`<option value="${s}" ${(l.status||'new')===s?'selected':''}>${t('st_'+s)}</option>`).join('')}</select></td><td style="white-space:nowrap"><button class="btn sm" data-gm="${esc(l.email)}">${t('gmail')}</button> <button class="btn l sm" data-cp="${esc(l.email)}">${t('copy')}</button></td></tr>`).join('')||`<tr><td colspan="6" class="muted">${t('empty')}</td></tr>`;
 $('#leadPager').innerHTML=L.length>per?`${pg*per+1}–${Math.min(L.length,pg*per+per)} / ${L.length} <button class="btn l sm" id="pPrev">‹</button> <button class="btn l sm" id="pNext">›</button>`:'';
 if($('#pPrev')){$('#pPrev').onclick=()=>{S.leadPage=Math.max(0,pg-1);renderLeads()};$('#pNext').onclick=()=>{S.leadPage=pg+1;renderLeads()}}
 const cnt=s=>all.filter(l=>(l.status||'new')===s).length;
 $('#kpis').innerHTML=[['k_total',all.length],['k_sent',cnt('sent')+cnt('reply')+cnt('won')+cnt('lost')],['k_reply',cnt('reply')+cnt('won')],['k_won',cnt('won')]].map(k=>`<div class="kpi"><span class="muted">${t(k[0])}</span><b>${k[1]}</b></div>`).join('');
 const today=new Date().toISOString().slice(0,10);$('#todayCount').textContent=t('today',{n:all.filter(l=>(l.sent_at||'').startsWith(today)).length});
 const upd=(email,patch)=>{const A=store.get('leads',[]);const x=A.find(z=>z.email===email);if(x)Object.assign(x,patch);store.set('leads',A);renderLeads()};
 $$('[data-st]').forEach(s=>s.onchange=()=>upd(s.dataset.st,{status:s.value}));
 $$('[data-gm]').forEach(b=>b.onclick=()=>{const l=all.find(z=>z.email===b.dataset.gm);const m=mailFor(l);window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(l.email)}&su=${encodeURIComponent(m.s)}&body=${encodeURIComponent(m.b)}`,'_blank');upd(l.email,{status:(l.status&&l.status!=='new')?l.status:'sent',sent_at:new Date().toISOString()})});
 $$('[data-cp]').forEach(b=>b.onclick=()=>{const l=all.find(z=>z.email===b.dataset.cp);const m=mailFor(l);navigator.clipboard.writeText('Subject: '+m.s+'\n\n'+m.b).then(()=>toast(t('copied')))})}

/* ================= EVENTOS ================= */
$$('.views button').forEach(b=>b.onclick=()=>view(b.dataset.view));
$$('.lang button').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;applyI18n()});
$('#to2').onclick=()=>{renderReqs();go(2)};$('#to3').onclick=()=>{renderQs();go(3)};
$$('[data-back]').forEach(b=>b.onclick=()=>go(+b.dataset.back));
$('#to4').onclick=async()=>{const R=compute();S.current=R;go(4);renderReport(R);$('#aiStatus').innerHTML='';if(user())await saveReport(R)};
$('#newBtn').onclick=()=>{S.proc=null;S.files=[];S.assign={};S.ans={};S.current=null;$('#city').value='';$('#project').value='';$('#to2').disabled=true;renderProcs();go(1)};
$('#pdfBtn').onclick=()=>window.print();
$('#aiBtn').onclick=aiReview;
const drop=$('#drop'),fin=$('#files');drop.onclick=()=>fin.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fin.click()}};fin.onchange=()=>addFiles(fin.files);
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
$('#csvIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=parseCSV(await f.text()).filter(r=>r.email&&/@/.test(r.email));const A=store.get('leads',[]);const have=new Set(A.map(x=>x.email.toLowerCase()));let n=0;rows.forEach(r=>{if(!have.has(r.email.toLowerCase())){r.status='new';A.push(r);have.add(r.email.toLowerCase());n++}});store.set('leads',A);toast('+'+n);renderLeads();e.target.value=''};
['fCountry','fStatus'].forEach(id=>$('#'+id).onchange=()=>{S.leadPage=0;renderLeads()});$('#fSearch').oninput=()=>{S.leadPage=0;renderLeads()};
$('#expCsv').onclick=()=>dl('alaprima-prospectos.csv',toCSV(store.get('leads',[])),'text/csv');
$('#saveKey').onclick=()=>{store.set('key',$('#apiKey').value.trim());store.set('model',$('#model').value.trim()||'claude-sonnet-4-6');toast(t('saved'))};
$('#clearKey').onclick=()=>{store.set('key','');$('#apiKey').value='';toast(t('saved'))};
$('#saveSender').onclick=()=>{store.set('sender',$('#sender').value);toast(t('saved'))};
$('#expAll').onclick=()=>dl('alaprima-prospectos-backup.json',JSON.stringify({leads:store.get('leads',[]),sender:store.get('sender','')}),'application/json');
$('#impAll').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(j.leads)store.set('leads',j.leads);if(j.sender)store.set('sender',j.sender);renderLeads();toast(t('saved'))}catch(err){toast(t('ai_fail',{e:err.message}))}};

/* ================= INICIO ================= */
(async function(){const q=new URLSearchParams(location.search);let s=null;try{s=localStorage.getItem('ap_lang')}catch(e){}const n=(navigator.language||'es').slice(0,2);S.lang=[q.get('lang'),s,n].find(x=>x&&I18N[x])||'es';
 $('#apiKey').value=store.get('key','');$('#model').value=store.get('model','claude-sonnet-4-6');$('#sender').value=store.get('sender','');
 renderLogos();applyI18n();go(1);
 CORE.mountAccount($('#acct'),{onNav:v=>view(v)});
 const h=location.hash.slice(1);view(['check','reports','orders','admin'].includes(h)?h:'check');
 await CORE.ready;
 CORE.onAuth(async u=>{$('#navAdmin').classList.toggle('hide',!CORE.isAdmin());if(u&&S.current&&!S.current.docId&&S.step===4){await saveReport(S.current);renderReport(S.current)}else if(S.step===4&&S.current)renderReport(S.current);refreshView()});
 const r=await CORE.handleReturn(RET);
 if(r&&r.needLogin){view('orders');CORE.openAuth('login',async()=>{const x=await CORE.handleReturn(RET);if(x&&x.orderId){S.paidOrder=x.orderId;view('orders')}})}
 else if(r&&r.orderId){S.paidOrder=r.orderId;view('orders')}
})();
</script>
</body>
